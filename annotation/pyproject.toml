[project]
name = "logbook-annotate"
version = "0.1.0"
description = "Annotate Logbook dashcam clips and pay the driver on Solana."
requires-python = ">=3.11"
dependencies = [
  "ultralytics>=8.3",
  "opencv-python-headless>=4.10",
  "pillow>=10",
  "pydantic>=2",
  "requests>=2",
  "typer>=0.12",
  "lap>=0.5.12",
]

[project.optional-dependencies]
mlx = ["mlx-vlm"]
ollama = ["ollama"]
dev = ["pytest>=8"]

[project.scripts]
logbook-annotate = "logbook_annotate.cli:app"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["logbook_annotate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
